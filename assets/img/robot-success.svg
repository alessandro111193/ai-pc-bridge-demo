<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 520" role="img" aria-labelledby="title"><title id="title">AI-PC, robot nero con occhi blu luminosi</title><defs><linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#424c62"/><stop offset=".4" stop-color="#151a25"/><stop offset="1" stop-color="#05080e"/></linearGradient><linearGradient id="mask" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#111c2a"/><stop offset="1" stop-color="#02060d"/></linearGradient><radialGradient id="halo"><stop stop-color="#14baff" stop-opacity=".5"/><stop offset="1" stop-color="#14baff" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><ellipse cx="230" cy="455" rx="180" ry="48" fill="url(#halo)"/><g stroke="#51ccff" stroke-opacity=".4" stroke-width="2"><path d="M146 396l-60 42-3 26M317 396l64 37 0 30" fill="none"/></g><g><rect x="132" y="313" width="196" height="148" rx="63" fill="url(#body)" stroke="#58677d" stroke-width="3"/><rect x="169" y="342" width="122" height="60" rx="24" fill="#081321" stroke="#36bbf3" stroke-opacity=".42"/><path d="M188 369h84" stroke="#17c8ff" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/><path d="M130 344c-50 7-59 60-34 80M331 344c50 9 54 57 30 79" stroke="#2f3d51" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M130 344c-50 7-59 60-34 80M331 344c50 9 54 57 30 79" stroke="#72889b" stroke-width="2" fill="none" stroke-linecap="round"/></g><g><rect x="198" y="65" width="64" height="48" rx="20" fill="#0e1420" stroke="#435b72" stroke-width="3"/><path d="M230 65V39" stroke="#586d80" stroke-width="10" stroke-linecap="round"/><circle cx="230" cy="29" r="13" fill="#21cbff" filter="url(#glow)"/><rect x="59" y="102" width="342" height="251" rx="112" fill="url(#body)" stroke="#53677b" stroke-width="5"/><path d="M70 213c0-71 66-102 160-102s162 31 162 102" fill="none" stroke="#a4b9d8" stroke-opacity=".22" stroke-width="4"/><rect x="86" y="148" width="288" height="170" rx="70" fill="url(#mask)" stroke="#3b91c9" stroke-opacity=".48" stroke-width="3"/><g class="animated-eyes" fill="#36d4ff" filter="url(#glow)"><rect x="126" y="208" width="83" height="43" rx="21"/><rect x="251" y="208" width="83" height="43" rx="21"/></g><g fill="#e1faff"><rect x="143" y="215" width="48" height="11" rx="6" opacity=".8"/><rect x="268" y="215" width="48" height="11" rx="6" opacity=".8"/></g><path d="M205 284q25 13 50 0" fill="none" class="robot-mouth" stroke="#21b5ee" stroke-width="5" stroke-linecap="round" opacity=".7"/><circle cx="72" cy="260" r="14" fill="#0e2336" stroke="#53b2db" stroke-width="5"/><circle cx="388" cy="260" r="14" fill="#0e2336" stroke="#53b2db" stroke-width="5"/></g><style>.animated-eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.6s infinite}.robot-mouth{transition:all .5s}@keyframes blink{0%,40%,43%,100%{transform:scaleY(1)}41.5%{transform:scaleY(.04)}}.animated-eyes{animation:happy-eyes 2.6s infinite alternate}@keyframes happy-eyes{from{transform:scaleY(.8)}to{transform:scaleY(1.1)}}.robot-mouth{stroke:#66f2ff;stroke-width:8}@media(prefers-reduced-motion:reduce){.animated-eyes{animation:none!important}}</style></svg>